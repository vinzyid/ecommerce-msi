; Konfigurasi PHP produksi VinzyPlay.

; Foto ulasan & produk dibatasi 2 MB per berkas oleh validasi Laravel.
; Satu form ulasan bisa membawa beberapa foto sekaligus, jadi post_max_size dibuat longgar.
upload_max_filesize = 4M
post_max_size = 24M

; Render PDF struk (dompdf) + chatbot memanggil API luar; beri ruang di atas bawaan.
memory_limit = 256M
max_execution_time = 60
default_socket_timeout = 60

; Fitur progres unggahan tidak dipakai; dimatikan untuk memperkecil permukaan serangan
; (lihat CVE-2026-109619 / PHP2Shell).
session.upload_progress.enabled = 0

display_errors = Off
log_errors = On
expose_php = Off

date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
